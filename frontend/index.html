<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="도시 이름으로 간편하게 확인하는 현재 날씨">
  <title>오늘의 날씨</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header><span class="eyebrow">YOUR DAILY WEATHER</span><h1>오늘, 그곳의 날씨.</h1><p>어디로 향하시나요? 도시의 현재 날씨를 확인해 보세요.</p></header>
    <section class="panel" aria-label="도시 날씨 검색">
      <form id="weather-form">
        <label for="city">도시 이름</label>
        <div class="search"><input id="city" name="city" placeholder="예: 서울, Busan, London" required minlength="2" maxlength="100" autocomplete="off"><button id="submit" type="submit">날씨 확인 <span aria-hidden="true">↗</span></button></div>
      </form>
      <p class="hint">같은 이름의 도시가 있으면 가장 관련성이 높은 결과를 표시합니다.</p>
      <p id="status" role="status" aria-live="polite">도시를 입력하면 현재 날씨가 여기에 표시됩니다.</p>
      <article id="weather" hidden aria-label="현재 날씨">
        <div class="location-row"><div><h2 id="location"></h2><p id="region"></p></div><span class="badge">현재 날씨</span></div>
        <div class="conditions"><span id="icon" aria-hidden="true"></span><div><div id="temperature"></div><p id="description"></p></div></div>
        <dl class="details"><div><dt>체감 온도</dt><dd id="feels-like"></dd></div><div><dt>습도</dt><dd id="humidity"></dd></div><div><dt>풍속</dt><dd id="wind"></dd></div></dl>
        <p id="updated" class="hint"></p>
      </article>
    </section>
    <footer>날씨 데이터 제공: <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a><br>작은 검색으로 시작하는 오늘의 준비.</footer>
  </main>
</body>
</html>
